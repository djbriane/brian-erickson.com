<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290"><rect width="1600" height="1290" fill="#F8F5EE"/>
<text x="80" y="70" fill="#365D45" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600">GPXPLORE / THE SYSTEM</text>
<text x="80" y="155" fill="#26382D" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700">Three repos, one product.</text>
<text x="80" y="212" fill="#647367" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="400">A shared data foundation, two planning experiences, and one launch.</text>
<rect x="400" y="270" width="800" height="190" rx="18" fill="#EADFD0"/>
<text x="435" y="320" fill="#AD6D46" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700">PIPELINE</text>
<text x="435" y="371" fill="#26382D" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="600">Prepare the data and routing foundation</text>
<text x="435" y="420" fill="#647367" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400">Campgrounds · route templates · surface and elevation</text>
<path d="M600 460 L600 505 L400 505 L400 565" fill="none" stroke="#AD6D46" stroke-width="4" stroke-linecap="round" />
<path d="M1000 460 L1000 505 L1200 505 L1200 565" fill="none" stroke="#AD6D46" stroke-width="4" stroke-linecap="round" />
<text x="85" y="540" fill="#AD6D46" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400">Published JSON and route caches</text>
<text x="1010" y="540" fill="#AD6D46" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400">Bundled snapshots and caches</text>
<rect x="80" y="565" width="650" height="200" rx="18" fill="#E0E8E9"/>
<text x="115" y="613" fill="#537A89" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700">WEB</text>
<text x="115" y="665" fill="#26382D" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="600">Plan on a bigger screen</text>
<text x="115" y="708" fill="#647367" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400">Planner · shared APIs · marketing · operations</text>
<text x="115" y="746" fill="#647367" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400">TypeScript / React / Cloudflare Workers</text>
<rect x="870" y="565" width="650" height="200" rx="18" fill="#E7E9DD"/>
<text x="905" y="613" fill="#365D45" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="700">iOS</text>
<text x="905" y="665" fill="#26382D" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="600">Plan and carry it on iPhone</text>
<text x="905" y="708" fill="#647367" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400">Ride Plans · field map · notes · GPX export</text>
<text x="905" y="746" fill="#647367" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400">Swift / SwiftUI / App Store</text>
<path d="M730 630 L870 630" fill="none" stroke="#365D45" stroke-width="3" stroke-linecap="round" />
<path d="M744 621 L730 630 L744 639" fill="none" stroke="#365D45" stroke-width="3" stroke-linecap="round" />
<path d="M856 621 L870 630 L856 639" fill="none" stroke="#365D45" stroke-width="3" stroke-linecap="round" />
<text x="650" y="815" fill="#365D45" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="600">Shared .gpxtrip files</text>
<text x="410" y="860" fill="#647367" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400">Plans move between the web and the native app.</text>
<rect x="80" y="915" width="1440" height="190" rx="18" fill="#365D45"/>
<text x="115" y="965" fill="#F8F5EE" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600">WHEN A PLAN NEEDS LIVE ENRICHMENT</text>
<text x="115" y="1020" fill="#F8F5EE" font-family="Helvetica, Arial, sans-serif" font-size="31" font-weight="600">Web and iOS → web-owned API → routing / enrichment runtime</text>
<text x="115" y="1067" fill="#CEDAC8" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="400">The pipeline repo owns the runtime tooling; the web Worker is the public gateway.</text>
<text x="80" y="1185" fill="#647367" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400">Conceptual repo map. Data publication is a build step; live requests are a separate path.</text>
<text x="80" y="1227" fill="#365D45" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600">GPXplore · October 1, 2026 · gpxplore.net</text>
</svg>